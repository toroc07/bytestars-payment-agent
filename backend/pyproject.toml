[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv"]

[tool.ruff.lint]
ignore = [
    "B008",  # FastAPI Depends, Query, Form, File in parameter defaults
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel]
# FastAPI instance for Vercel's zero-config Python runtime (docs/DEPLOY.md).
entrypoint = "app.main:app"

[tool.vercel.scripts]
# Copies ../dataset/company.json into backend/seed_data/ (only backend/ is deployed).
build = "python scripts/vercel_build.py"
